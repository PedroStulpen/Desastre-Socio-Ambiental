<div class="container">
    <div class="card card-container">
        <div class="col-12 text-center">
            <label style="color:#00063d; font-size: 2.0rem;" class="mb-4"><b>SOS Petrópolis</b></label>
        </div>
        <form class="form-signin" [formGroup]="form" (ngSubmit)="onSubmit()">
            <h2 class="h3 mb-3 font-weight-normal text-center">Ponto de Apoio</h2>
            <label for="email" class="sr-only">Celular</label>
            <input type="text" formControlName="username" class="form-control" mask="(00) 00000-0000"
                placeholder="Informe seu celular" [dropSpecialCharacters]="false">
            <div class="error" *ngIf="loginInvalid">
                Celular é obrigatório.
            </div>
            <label for="senha" class="sr-only">Senha</label>
            <input type="password" class="form-control" placeholder="Informe sua senha" formControlName="password">
            <div class="error" *ngIf="loginInvalid">
                Senha é obrigatória.
            </div>
            <button class="btn btn-lg btn-primary btn-block btn-signin" type="submit">
                <span>ENTRAR</span>
            </button>
            <br>
            <button class="btn btn-lg btn-primary btn-block btn-signin" type="button" (click)="cadastro()">
                <span> CADASTRE-SE</span>
            </button>
            <button class="btn btn-lg btn-primary btn-block btn-signin" type="button" routerLink="/lista-necessidade">
                <span> VOLTAR</span>
            </button>
            <div class="error" *ngIf="isLoginFailed">
                {{errorMessage}}
            </div>
        </form>
    </div>
</div>
