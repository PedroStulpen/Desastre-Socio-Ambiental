<div class="modal-header">
    <label class="modal-title corTitulo">Justificativa</label>
    <button type="button" class="btn" aria-label="Close" (click)="activeModal.dismiss('')">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body" style="padding: 20px;">   
    <h4>{{ texto }}</h4>
    <div class="input-group">
        <textarea class="form-control" aria-label="With textarea" [(ngModel)]="justificativa"></textarea>
    </div>
</div>
<div class="modal-footer">
    <button mat-button (click)="activeModal.close('')" class="btn btn-light"><span class="material-icons">
            close
        </span> Cancelar</button>
    <button class="btn btn-primary" (click)="justificar()"><svg xmlns="http://www.w3.org/2000/svg"
            width="20" height="20" fill="currentColor" class="bi bi-check" viewBox="0 0 16 16">
            <path
                d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
        </svg><span fxHide.xs> Justificar</span></button>
</div>
