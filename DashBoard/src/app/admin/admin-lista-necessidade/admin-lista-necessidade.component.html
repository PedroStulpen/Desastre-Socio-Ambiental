<div class="row">
    <mat-toolbar class="barraTitulo">
        <mat-icon class="iconeTitulo">checklist </mat-icon>
        <span class="textoTitulo"> Lista de Necessidades</span>
    </mat-toolbar>
</div>
<br>
<div class="container">
    <div class="col-12" align="end">
        <button type="button" class="btn btn-primary" (click)="cadastrar()"><svg xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
                <path d="M8 0a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2H9v6a1 1 0 1 1-2 0V9H1a1 1 0 0 1 0-2h6V1a1 1 0 0 1 1-1z" />
            </svg><span fxHide.xs> Cadastrar</span></button>
    </div>
    <div class="col">
        <label for="basic-url" class="form-label">Filter</label>
        <div class="input-group mb-3">
            <input type="text" class="form-control" (keyup)="applyFilter($event)" placeholder="Ex. nome" #input>
        </div>
    </div>
    <div class="col-12">
        <div class="table-responsive" *ngIf="!vazio">
            <table mat-table [dataSource]="dataSource" matSort matSortActive="item" matSortDirection="asc" (matSortChange)="sortData($event)" class="mat-elevation-z8">

                <!-- nome Column -->
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="item"> Item </th>
                    <td mat-cell *matCellDef="let row" > {{row.item}} </td>
                </ng-container>

                <ng-container matColumnDef="qtd">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="quantidade"> Quantidade </th>
                    <td mat-cell *matCellDef="let row" style="text-align: center;" > {{row.quantidade}} </td>
                </ng-container>

                <ng-container matColumnDef="observacao">
                  <th mat-header-cell *matHeaderCellDef> Observação </th>
                  <td mat-cell *matCellDef="let row"> {{row.observacao}} </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="editar">
                    <th mat-header-cell *matHeaderCellDef class="larguraEditar"></th>
                    <td mat-cell *matCellDef="let row" class="larguraEditar">
                        <button mat-button class="btn btn-grid" (click)="editar(row)">
                            <span class="material-icons">
                                edit
                            </span> <span fxHide.xs>Edit</span>
                        </button>
                    </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="excluir">
                    <th mat-header-cell *matHeaderCellDef class="larguraExcluir"></th>
                    <td mat-cell *matCellDef="let row" class="larguraExcluir">
                        <button mat-button class="btn btn-grid" (click)="excluir(row)">
                            <span class="material-icons">
                              check
                            </span> <span fxHide.xs>Finalizar</span>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
                </tr>
            </table>

            <!-- <mat-paginator [pageSizeOptions]="[20, 30, 50, 100]" aria-label="Select page of dados"></mat-paginator> -->
        </div>
    </div>
    <div class="col" *ngIf="vazio">
        <br>
        <label for="basic-url" class="form-label error">Não existem itens cadastrados.</label>
    </div>
</div>
